name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Generated assets are up to date
        run: |
          mkdir -p /tmp/committed && cp -R super_mona/assets super_mona/icon.png /tmp/committed/
          python tools/build_super_mona_assets.py
          python - <<'PY'
          import sys
          from PIL import Image
          bad = []
          for name in ("assets/tiles.png", "assets/players.png", "assets/mobs.png", "icon.png"):
              old = Image.open("/tmp/committed/" + name).convert("RGBA")
              new = Image.open("super_mona/" + name).convert("RGBA")
              if old.size != new.size or old.tobytes() != new.tobytes():
                  bad.append(name)
          if bad:
              sys.exit("Regenerate and commit: " + ", ".join(bad))
          print("generated assets match")
          PY
